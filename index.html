<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack Club Embassy (Fan-Made)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="logo-wrapper">
            <h1 class="pixel-text">Hack Club <br> Embassy </h1>
            </div>
            
        </header>

        <main>
            <section class="headline-section">
                <h2 class="massive-pixel-text">Get ur own<br>Hack Club ID </h2>


                <div class="input-wrapper">
                    <input type="email" placeholder="u@example.com" class="retro-input" autocomplete="off" spellcheck="false">
                    <span class="input-indicator">press enter :3</span>

                </div>


            </section>

            <section class="sticker-grid" id="sticker-canvas">
                <img src="passport.png" alt="passport sticker" class="sticker-float-1" style="top: 15%; left: 10%;">
                <img src="YubiKey.png" alt="YubiKey Sticker" class="sticker-float-2" style="top: 35%; right: 15%;">
                <img src="shark(blahaj).png" alt="blahaj Shark Sticker" class="sticker-float-3" style="bottom: 30%; left: 20%;">
                <img src="watch.png" alt="casio watch sticker" class="sticker-float-1" style="bottom: 15%; right: 25%;">

            </section>
            
        </main>
    </div>
    
</body>
</html>
